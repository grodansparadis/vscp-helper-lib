name: Windows Build

on: [push]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  VSCP_PATH: '${{ github.workspace }}/vscp'
  ENVIRONMENT_SCRIPT: "C:/Program Files (x86)/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
  GENERATORS: "Ninja"
  BUILD_CONFIGURATION: Release

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  #
  # https://github.com/marketplace/actions/run-vcpkg
  # https://github.com/ilammy/msvc-dev-cmd  

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:

    - name: Install ms-dev environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Clone
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Read library version
      shell: powershell
      run: |
        $version = (Select-String -Path src/libversion.h -Pattern '^#define VSCP_HELPER_LIB_VERSION "(.+)"$').Matches[0].Groups[1].Value
        "LIB_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Get latest CMake and ninja
      # Using 'latest' branch, the most recent CMake and ninja are installed.
      uses: lukka/get-cmake@latest 


    - name: Checkout vcpkg repo
      uses: actions/checkout@v3
      with:
        repository: microsoft/vcpkg
        path: vcpkg

    - name: Install NSIS
      uses: negrutiu/nsis-install@v2

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup vcpkg
      shell: cmd
      run: |
          set VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg
          call %VCPKG_ROOT%\bootstrap-vcpkg.bat
          %VCPKG_ROOT%\vcpkg.exe integrate install
          %VCPKG_ROOT%\vcpkg.exe install expat:x64-windows
          %VCPKG_ROOT%\vcpkg.exe install pthread:x64-windows
          %VCPKG_ROOT%\vcpkg.exe install dlfcn-win32:x64-windows
          %VCPKG_ROOT%\vcpkg.exe install openssl:x64-windows
          %VCPKG_ROOT%\vcpkg.exe install spdlog:x64-windows

    - name: Install 7Zip PowerShell Module
      shell: powershell
      run: Install-Module 7Zip4PowerShell -Force -Verbose

    - name: Build
      run: |
          mkdir build
          cd build 
          cmake .. -G "${{ env.GENERATORS }}" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVSCP_PATH=vscp
          cmake --build . --parallel
          #msbuild libvscphelper.sln /p:Configuration=Release
          cpack .
          Get-ChildItem -File *.zip, *.exe | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" |
              Set-Content -Encoding ascii "$($_.FullName).sha256"
          }

      # Save artifacts    
    - uses: actions/upload-artifact@v4
      with:
        name: libvscphelper_windows_x64_${{ env.LIB_VERSION }}_zip
        path: |
          ${{ github.workspace }}/build/*.zip
          ${{ github.workspace }}/build/*.zip.sha256
        retention-days: 30

    - uses: actions/upload-artifact@v4
      with:
        name: libvscphelper_windows_x64_${{ env.LIB_VERSION }}_exe
        path: |
          ${{ github.workspace }}/build/*.exe
          ${{ github.workspace }}/build/*.exe.sha256
        retention-days: 30
