name: macOS Build

on: [push]

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read library version
        shell: bash
        run: echo "LIB_VERSION=$(sed -n 's/^#define VSCP_HELPER_LIB_VERSION "\(.*\)"$/\1/p' src/libversion.h)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: brew install cmake openssl expat zlib googletest pandoc

      - name: Create Build Environment
        run: cmake -E make_directory ${{ github.workspace }}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: |
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/ \
            -DVSCP_PATH=vscp/ \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) \
            -DEXPAT_INCLUDE_DIR=$(brew --prefix expat)/include \
            -DEXPAT_LIBRARY=$(brew --prefix expat)/lib/libexpat.dylib

      - name: Build
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Package
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: |
          cpack -G TGZ
          for artifact in libvscphelper_*.tar.gz; do
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}_libvscphelper_${{ env.LIB_VERSION }}_tgz
          path: |
            ${{ github.workspace }}/build/libvscphelper_*.tar.gz
            ${{ github.workspace }}/build/libvscphelper_*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
